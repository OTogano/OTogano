name: Update README stats cards

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 03:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=OTogano&show_icons=true&count_private=true&include_all_commits=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=OTogano&layout=compact&theme=dark&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate WakaTime card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=Togano&layout=compact&theme=dark
          path: profile/wakatime.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Togano&theme=dark&disable_animations=false
          path: profile/streak.svg
          token: ${{ secrets.GH_TOKEN }}
         
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
